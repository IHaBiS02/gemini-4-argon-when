<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemini 모델 대기 알리미</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1c1e21; --muted: #6b7280; --border: #d9dce1;
    --accent: #2563eb; --ok: #15803d; --err: #b91c1c; --busy: #b45309; --input: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111315; --card: #1b1e22; --text: #e6e8eb; --muted: #9aa1ab; --border: #30353c;
      --accent: #5b8def; --ok: #4ade80; --err: #f87171; --busy: #fbbf24; --input: #15181b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); }
  section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  label.inline { display: inline-flex; align-items: center; gap: 6px; margin: 0 16px 0 0; color: var(--text); font-size: 14px; }
  input[type=text], input[type=password], input[type=number], textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--input); color: var(--text); font: inherit;
  }
  textarea { font-family: ui-monospace, monospace; font-size: 13px; resize: vertical; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1 1 160px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  button {
    padding: 9px 16px; border: 1px solid var(--border); border-radius: 6px; background: var(--card);
    color: var(--text); font: inherit; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #runState { color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  td.model { font-family: ui-monospace, monospace; word-break: break-all; }
  td.detail { color: var(--muted); word-break: break-word; }
  .st-ok { color: var(--ok); font-weight: 600; }
  .st-err { color: var(--err); }
  .st-busy { color: var(--busy); }
  #log {
    height: 220px; overflow-y: auto; margin: 0; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--input); font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word;
  }
  #alarm {
    display: none; position: sticky; top: 8px; z-index: 10; background: var(--ok); color: #fff;
    border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  #alarm.on { display: flex; }
  #alarm strong { flex: 1 1 200px; word-break: break-all; }
  #alarm button { border-color: #fff; background: transparent; color: #fff; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Gemini 모델 대기 알리미</h1>
  <p class="sub">여러 모델 이름에 일정 간격으로 요청을 보내고, 에러가 아닌 답변이 오면 멈추고 소리로 알려줍니다.</p>

  <div id="alarm">
    <strong id="alarmText"></strong>
    <button id="alarmOff">알림 끄기</button>
  </div>

  <section>
    <h2>인증</h2>
    <label class="inline"><input type="checkbox" id="useAis" checked> AI Studio API 키</label>
    <label class="inline"><input type="checkbox" id="useVertex"> Vertex AI 서비스 계정 JSON</label>
    <div class="hint">둘 다 켜면 각 모델 이름을 양쪽에 동시에 요청합니다.</div>

    <div id="aisBox">
      <label for="apiKey">API 키</label>
      <input type="password" id="apiKey" autocomplete="off" placeholder="AIza...">
    </div>

    <div id="vertexBox" hidden>
      <label for="saFile">서비스 계정 JSON 파일</label>
      <input type="file" id="saFile" accept=".json,application/json">
      <label for="saJson">또는 JSON 내용 붙여넣기</label>
      <textarea id="saJson" rows="5" spellcheck="false" placeholder='{"type": "service_account", "project_id": "...", "private_key": "...", "client_email": "..."}'></textarea>
      <label for="location">리전 (location)</label>
      <input type="text" id="location" value="global" placeholder="global, us-central1 ...">
    </div>

    <label class="inline" style="margin-top:14px"><input type="checkbox" id="save"> 이 브라우저에 설정 저장 (키 포함, localStorage)</label>
    <div class="hint">키와 JSON은 이 브라우저에서 Google API로만 직접 전송됩니다.</div>
  </section>

  <section>
    <h2>요청 설정</h2>
    <label for="models">모델 이름 (한 줄에 하나)</label>
    <textarea id="models" rows="8" spellcheck="false" placeholder="gemini-4-argon&#10;gemini-4-pro">gemini-4-argon
gemini-4-argon-preview
gemini-4-pro
gemini-4-pro-preview
gemini-3.9-flash
gemini-3.9-flash-preview
gemini-4-flash
gemini-4-flash-preview
gemini-4-flash-lite
gemini-4-flash-lite-preview
</textarea>
    <div class="row">
      <div>
        <label for="interval">요청 간격 (초)</label>
        <input type="number" id="interval" min="1" step="1" value="30">
      </div>
      <div>
        <label for="maxTokens">최대 출력 토큰</label>
        <input type="number" id="maxTokens" min="1" step="1" value="50">
      </div>
      <div>
        <label for="prompt">보낼 메시지</label>
        <input type="text" id="prompt" value="hi">
      </div>
    </div>
    <label class="inline" style="margin-top:14px"><input type="checkbox" id="stopAll" checked> 한 모델이라도 성공하면 전체 중지</label>
    <div class="hint">끄면 성공한 모델만 멈추고 나머지는 계속 확인합니다.</div>
  </section>

  <section>
    <div class="actions">
      <button class="primary" id="start">시작</button>
      <button id="stop" disabled>중지</button>
      <button id="testSound">소리 테스트</button>
      <span id="runState">대기 중</span>
    </div>
  </section>

  <section>
    <h2>모델 상태</h2>
    <table>
      <thead><tr><th>경로</th><th>모델</th><th>상태</th><th>시도</th><th>마지막 응답</th></tr></thead>
      <tbody id="status"><tr><td colspan="5" class="detail">아직 시작하지 않았습니다.</td></tr></tbody>
    </table>
  </section>

  <section>
    <h2>로그</h2>
    <pre id="log"></pre>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const REQUEST_TIMEOUT_MS = 60000;
const LOG_MAX_LINES = 500;
const STORE_KEY = 'gemini-waiter-settings';

// ---------- 설정 저장/복원 ----------
const FIELDS = ['apiKey', 'saJson', 'location', 'models', 'interval', 'maxTokens', 'prompt'];

function applyMode() {
  $('aisBox').hidden = !$('useAis').checked;
  $('vertexBox').hidden = !$('useVertex').checked;
}

function saveSettings() {
  try {
    if (!$('save').checked) { localStorage.removeItem(STORE_KEY); return; }
    const data = { useAis: $('useAis').checked, useVertex: $('useVertex').checked, stopAll: $('stopAll').checked };
    for (const f of FIELDS) data[f] = $(f).value;
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  } catch {}
}

function loadSettings() {
  try {
    const data = JSON.parse(localStorage.getItem(STORE_KEY));
    if (!data) return;
    $('save').checked = true;
    for (const f of FIELDS) if (data[f] != null) $(f).value = data[f];
    $('stopAll').checked = data.stopAll !== false;
    if (data.useAis != null) $('useAis').checked = data.useAis;
    if (data.useVertex != null) $('useVertex').checked = data.useVertex;
  } catch {}
}

// ---------- 로그 ----------
function log(msg) {
  const el = $('log');
  const lines = el.textContent ? el.textContent.split('\n') : [];
  lines.push(`[${new Date().toLocaleTimeString()}] ${msg}`);
  el.textContent = lines.slice(-LOG_MAX_LINES).join('\n');
  el.scrollTop = el.scrollHeight;
}

// ---------- 알림 소리 ----------
let audioCtx = null;
let alarmNodes = null;

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// 백그라운드 탭의 타이머 제한을 피하려고 오디오 클럭에 미리 예약해 둔다.
function playBeeps(seconds) {
  const ctx = ensureAudio();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'square';
  gain.gain.value = 0;
  osc.connect(gain).connect(ctx.destination);
  const t0 = ctx.currentTime + 0.05;
  for (let i = 0; i * 0.25 < seconds; i++) {
    if (i % 4 === 3) continue;
    const t = t0 + i * 0.25;
    osc.frequency.setValueAtTime(i % 4 === 1 ? 1175 : 880, t);
    gain.gain.setValueAtTime(0.25, t);
    gain.gain.setValueAtTime(0, t + 0.15);
  }
  osc.start(t0);
  osc.stop(t0 + seconds);
  return { osc, gain };
}

function stopBeeps() {
  if (!alarmNodes) return;
  try { alarmNodes.osc.stop(); } catch {}
  alarmNodes.gain.disconnect();
  alarmNodes = null;
}

const baseTitle = document.title;

function raiseAlarm(model) {
  $('alarmText').textContent = `✅ ${model} 응답 도착!`;
  $('alarm').classList.add('on');
  document.title = `✅ ${model} 응답 도착!`;
  stopBeeps();
  alarmNodes = playBeeps(600);
  if ('Notification' in window && Notification.permission === 'granted') {
    try { new Notification('Gemini 모델 응답 도착', { body: model }); } catch {}
  }
}

function dismissAlarm() {
  stopBeeps();
  $('alarm').classList.remove('on');
  document.title = baseTitle;
}

// ---------- Vertex AI 인증 (서비스 계정 JWT → 액세스 토큰) ----------
const b64url = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes)))
  .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64urlJson = obj => b64url(new TextEncoder().encode(JSON.stringify(obj)));

let tokenCache = null; // { key, token, expiresAt }

async function getVertexToken(sa) {
  const cacheKey = sa.client_email + sa.private_key_id;
  if (tokenCache && tokenCache.key === cacheKey && Date.now() < tokenCache.expiresAt - 120000) {
    return tokenCache.token;
  }
  const tokenUri = sa.token_uri || 'https://oauth2.googleapis.com/token';
  const now = Math.floor(Date.now() / 1000);
  const unsigned = b64urlJson({ alg: 'RS256', typ: 'JWT', kid: sa.private_key_id }) + '.' + b64urlJson({
    iss: sa.client_email,
    scope: 'https://www.googleapis.com/auth/cloud-platform',
    aud: tokenUri,
    iat: now,
    exp: now + 3600,
  });
  const pem = sa.private_key.replace(/-----[^-]+-----/g, '').replace(/\s+/g, '');
  const der = Uint8Array.from(atob(pem), c => c.charCodeAt(0));
  const key = await crypto.subtle.importKey(
    'pkcs8', der, { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }, false, ['sign']);
  const sig = await crypto.subtle.sign('RSASSA-PKCS1-v1_5', key, new TextEncoder().encode(unsigned));
  const res = await fetch(tokenUri, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
      assertion: unsigned + '.' + b64url(sig),
    }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || !data.access_token) {
    throw new Error(`토큰 발급 실패 (${res.status}): ${data.error_description || data.error || '알 수 없는 오류'}`);
  }
  tokenCache = { key: cacheKey, token: data.access_token, expiresAt: Date.now() + (data.expires_in || 3600) * 1000 };
  return data.access_token;
}

// ---------- 요청 ----------
async function buildRequest(cfg, provider, model) {
  if (provider === 'ais') {
    return {
      url: `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,
      headers: { 'x-goog-api-key': cfg.apiKey },
    };
  }
  const token = await getVertexToken(cfg.sa);
  const host = cfg.location === 'global' ? 'aiplatform.googleapis.com' : `${cfg.location}-aiplatform.googleapis.com`;
  return {
    url: `https://${host}/v1beta1/projects/${encodeURIComponent(cfg.sa.project_id)}/locations/${encodeURIComponent(cfg.location)}/publishers/google/models/${encodeURIComponent(model)}:generateContent`,
    headers: { Authorization: `Bearer ${token}` },
  };
}

// 성공이면 { ok: true, detail }, 에러면 { ok: false, detail }
async function probe(cfg, provider, model, signal) {
  const { url, headers } = await buildRequest(cfg, provider, model);
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...headers },
    body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: cfg.prompt }] }], generationConfig: { maxOutputTokens: cfg.maxTokens } }),
    signal,
  });
  const text = await res.text();
  let data = null;
  try { data = JSON.parse(text); } catch {}
  if (!res.ok) {
    const err = Array.isArray(data) ? data[0]?.error : data?.error;
    return { ok: false, detail: `${res.status} ${err?.status || ''} ${err?.message || text.slice(0, 200)}`.replace(/\s+/g, ' ').trim() };
  }
  const reply = (data?.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('').trim();
  return { ok: true, detail: reply ? reply.slice(0, 200) : `(텍스트 없음, finishReason: ${data?.candidates?.[0]?.finishReason || '?'})` };
}

// ---------- 실행 루프 ----------
let run = null; // { cfg, models: Map<name, state>, abort }

// 백그라운드 탭에서도 간격이 유지되도록 워커 타이머를 쓴다.
let timerWorker = null;
let fallbackTimer = null;
try {
  timerWorker = new Worker(URL.createObjectURL(new Blob(
    ['let t;onmessage=e=>{clearInterval(t);if(e.data>0)t=setInterval(()=>postMessage(0),e.data)}'],
    { type: 'text/javascript' })));
  timerWorker.onmessage = () => tick();
} catch {}

function setTimer(ms) {
  if (timerWorker) { timerWorker.postMessage(ms); return; }
  clearInterval(fallbackTimer);
  if (ms > 0) fallbackTimer = setInterval(tick, ms);
}

const PROVIDER_LABEL = { ais: 'AI Studio', vertex: 'Vertex AI' };
const STATE_LABEL = { idle: '대기', busy: '요청 중', error: '에러', ok: '성공' };
const STATE_CLASS = { idle: '', busy: 'st-busy', error: 'st-err', ok: 'st-ok' };

function renderStatus() {
  const body = $('status');
  body.textContent = '';
  for (const [name, m] of run.models) {
    const tr = document.createElement('tr');
    const cells = [[PROVIDER_LABEL[m.provider], ''], [m.model, 'model'], [STATE_LABEL[m.state], STATE_CLASS[m.state]], [String(m.attempts), ''], [m.detail, 'detail']];
    for (const [text, cls] of cells) {
      const td = document.createElement('td');
      td.textContent = text;
      td.className = cls;
      tr.appendChild(td);
    }
    body.appendChild(tr);
  }
}

async function checkModel(session, name) {
  const m = session.models.get(name);
  if (m.done || m.inFlight) return;
  m.inFlight = true;
  m.attempts++;
  m.state = 'busy';
  renderStatus();
  const timeout = setTimeout(() => m.ctrl?.abort(), REQUEST_TIMEOUT_MS);
  m.ctrl = new AbortController();
  let result;
  try {
    result = await probe(session.cfg, m.provider, m.model, m.ctrl.signal);
  } catch (e) {
    result = { ok: false, detail: e.name === 'AbortError' ? '시간 초과 또는 취소됨' : `요청 실패: ${e.message}` };
  }
  clearTimeout(timeout);
  m.inFlight = false;
  if (run !== session) return; // 중지된 뒤 도착한 응답은 버린다
  m.detail = result.detail;
  if (result.ok) {
    m.state = 'ok';
    m.done = true;
    log(`✅ ${name} #${m.attempts} 성공: ${result.detail}`);
    renderStatus();
    raiseAlarm(name);
    const allDone = [...session.models.values()].every(x => x.done);
    if (session.cfg.stopAll || allDone) stop(allDone ? '모든 모델 응답 완료' : `${name} 응답으로 중지`);
  } else {
    m.state = 'error';
    log(`❌ ${name} #${m.attempts} ${result.detail}`);
    renderStatus();
  }
}

function tick() {
  if (!run) return;
  for (const name of run.models.keys()) checkModel(run, name);
}

function readConfig() {
  const cfg = {
    useAis: $('useAis').checked,
    useVertex: $('useVertex').checked,
    prompt: $('prompt').value || 'hi',
    stopAll: $('stopAll').checked,
    intervalMs: Math.max(1, Number($('interval').value) || 0) * 1000,
    maxTokens: Math.max(1, Math.floor(Number($('maxTokens').value)) || 50),
    models: [...new Set($('models').value.split('\n').map(s => s.trim().replace(/^models\//, '')).filter(Boolean))],
  };
  if (!cfg.models.length) throw new Error('모델 이름을 하나 이상 입력하세요.');
  if (!cfg.useAis && !cfg.useVertex) throw new Error('AI Studio와 Vertex AI 중 하나 이상을 선택하세요.');
  if (cfg.useAis) {
    cfg.apiKey = $('apiKey').value.trim();
    if (!cfg.apiKey) throw new Error('API 키를 입력하세요.');
  }
  if (cfg.useVertex) {
    try { cfg.sa = JSON.parse($('saJson').value); } catch { throw new Error('서비스 계정 JSON을 읽을 수 없습니다.'); }
    for (const k of ['client_email', 'private_key', 'project_id']) {
      if (!cfg.sa?.[k]) throw new Error(`서비스 계정 JSON에 ${k} 항목이 없습니다.`);
    }
    cfg.location = $('location').value.trim() || 'global';
  }
  cfg.providers = [cfg.useAis && 'ais', cfg.useVertex && 'vertex'].filter(Boolean);
  return cfg;
}

function start() {
  let cfg;
  try { cfg = readConfig(); } catch (e) { alert(e.message); return; }
  saveSettings();
  ensureAudio(); // 사용자 클릭 시점에 오디오를 열어 둬야 나중에 소리가 난다
  dismissAlarm();
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();

  const targets = cfg.providers.flatMap(provider => cfg.models.map(model => ({ provider, model })));
  run = { cfg, models: new Map(targets.map(t => [`${PROVIDER_LABEL[t.provider]} / ${t.model}`, { ...t, state: 'idle', attempts: 0, detail: '', done: false, inFlight: false, ctrl: null }])) };
  $('start').disabled = true;
  $('stop').disabled = false;
  $('runState').textContent = `실행 중 — ${cfg.intervalMs / 1000}초 간격, 대상 ${targets.length}개`;
  log(`시작: ${cfg.providers.map(p => p === 'ais' ? 'AI Studio' : `Vertex AI (${cfg.sa.project_id}, ${cfg.location})`).join(' + ')}, ${cfg.intervalMs / 1000}초 간격, 모델: ${cfg.models.join(', ')}`);
  renderStatus();
  tick();
  setTimer(cfg.intervalMs);
}

function stop(reason) {
  if (!run) return;
  setTimer(0);
  const session = run;
  run = null;
  for (const m of session.models.values()) m.ctrl?.abort();
  $('start').disabled = false;
  $('stop').disabled = true;
  $('runState').textContent = `중지됨 — ${reason}`;
  log(`중지: ${reason}`);
}

// ---------- 이벤트 ----------
$('start').addEventListener('click', start);
$('stop').addEventListener('click', () => stop('사용자가 중지'));
$('alarmOff').addEventListener('click', dismissAlarm);
$('testSound').addEventListener('click', () => { stopBeeps(); alarmNodes = playBeeps(2); });
$('saFile').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  $('saJson').value = await file.text();
  saveSettings();
});
for (const id of ['useAis', 'useVertex']) {
  $(id).addEventListener('change', () => { applyMode(); saveSettings(); });
}
for (const id of [...FIELDS, 'save', 'stopAll']) $(id).addEventListener('change', saveSettings);

loadSettings();
applyMode();
</script>
</body>
</html>
